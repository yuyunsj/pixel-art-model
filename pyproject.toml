[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-art-model"
version = "0.1.0"
description = "Local pixel art character generation with a Masked Pixel Transformer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.5,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
exclude = [".venv", ".uv-cache"]
